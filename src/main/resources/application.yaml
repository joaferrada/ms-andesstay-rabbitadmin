server:
  port: 8084

spring:
  application:
    name: ms-andesstay-rabbitadmin

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://sts.windows.net/524de923-14d5-4e21-bbbf-525ca2e1ced7/
          jwk-set-uri: https://login.microsoftonline.com/524de923-14d5-4e21-bbbf-525ca2e1ced7/discovery/keys

  # Con el cluster de infra/mq: RABBITMQ_ADDRESSES=localhost:5672,localhost:5673
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

andesstay:
  security:
    # true: exige JWT de Entra ID con rol Admin. false: solo para pruebas locales con Postman
    enabled: ${ANDESSTAY_SECURITY_ENABLED:true}
  rabbitadmin:
    source: ms-andesstay-rabbitadmin
    # Cuanto esperar el publisher confirm al publicar mensajes de prueba
    confirm-timeout: 5s
    # API HTTP de la Management UI (AMQP no permite listar colas)
    management:
      url: ${RABBITMQ_MANAGEMENT_URL:http://localhost:15672}
      username: ${RABBITMQ_USERNAME:guest}
      password: ${RABBITMQ_PASSWORD:guest}
      vhost: ${RABBITMQ_VHOST:/}
